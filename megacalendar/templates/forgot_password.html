{% extends "base.html" %}
{% block title %}Forgot your password? · megacalendar{% endblock %}
{% block content %}
<div class="login-box">
  <h2>Forgot your password?</h2>
  <p class="hint" style="text-align:center">Enter your username or email; if we find a matching account we'll send a 7-character reset code.</p>
  <form method="post" action="/forgot-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <fieldset>
      <label>Username or email <input name="identifier" required autofocus></label>
    </fieldset>
    <div class="actions"><button class="primary" type="submit" style="width:100%">Send reset code</button></div>
  </form>
  <p class="hint" style="text-align:center"><a href="/login">Back to log in</a></p>
</div>
{% endblock %}
