{% extends "base.html" %}
{% block title %}Log in · megacalendar{% endblock %}
{% block content %}
<div class="login-box">
  <h2>Log in</h2>
  <form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <fieldset>
      <label>Username <input name="username" value="{{ username or '' }}" required autofocus autocomplete="username"></label>
      <label style="margin-top:.8rem">Password <input name="password" type="password" required autocomplete="current-password"></label>
    </fieldset>
    <div class="actions"><button class="primary" type="submit" style="width:100%">Log in</button></div>
  </form>
</div>
{% endblock %}
