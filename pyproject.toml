[project]
name = "megacalendar"
version = "0.6.0"
description = "Web app that generates print-ready, large-format (A0/A1) CMYK PDF wall calendars"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "svglib>=1.5",
    "pillow>=10",
    "numpy>=1.26",
    "holidays>=0.50",
    "babel>=2.15",
    "itsdangerous>=2.1",
    "pymupdf>=1.24",
    "email-validator>=2.1",
    "phonenumbers>=8.13",
    "pyotp>=2.9",
    "qrcode>=7.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1", "cryptography>=42"]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=4", "esprima>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["megacalendar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
